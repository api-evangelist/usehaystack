components:
  schemas:
    PostPublicApiMetricsRequest:
      type: object
      properties:
        startDate:
          type: string
          description: 'The start date of the metrics data range (format: YYYY-MM-DD).'
        endDate:
          type: string
          description: 'The end date of the metrics data range (format: YYYY-MM-DD).'
        granularity:
          type: string
          description: The granularity of the metrics data (week/month/cycle).
        type:
          type: string
          description: The type of metrics data (issue/pull_request/cycle/deployment).
        groupBy:
          type: string
          description: The parameter to group the metrics data by (team/author/assignee/epic, and more).
        filters:
          type: array
          description: The filter array, advised to use the filter array given by the Copy API Request feature.
      required:
      - startDate
      - endDate
      - granularity
      - type
      - groupBy
    PostPublicApiMetricsResponse:
      type: object
      properties:
        data:
          type: array
          description: The metrics objects (regular or group‑by structure as described).
        averages:
          type: object
          description: Averages of the results, format varies with regular, group‑by, or cycle granularity.
    PostPublicApiTeamTeamidMetricsRequest:
      type: object
      properties:
        startDate:
          type: string
          description: 'The start date of the metrics data range (format: YYYY-MM-DD).'
        endDate:
          type: string
          description: 'The end date of the metrics data range (format: YYYY-MM-DD).'
        granularity:
          type: string
          description: The granularity of the metrics data (week/month/cycle).
        type:
          type: string
          description: The type of metrics data (issue/pull_request/cycle/deployment).
        groupBy:
          type: string
          description: The parameter to group the metrics data by (team/author/assignee/epic, and more).
        filters:
          type: array
          description: The filter array, advised to use the filter array given by the Copy API Request feature.
      required:
      - startDate
      - endDate
      - granularity
      - type
      - groupBy
    PostPublicApiTeamTeamidMetricsResponse:
      type: object
      properties:
        data:
          type: array
          description: The metrics objects (regular or group‑by structure as described).
        averages:
          type: object
          description: Averages of the results, format varies with regular, group‑by, or cycle granularity.
